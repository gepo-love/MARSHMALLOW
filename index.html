  function nowStr(t) {

  }

    if (reset) reset.onclick = function () { w.location.href = w.location.pathname + '?reset=1'; };
    if (open) open.onclick = function () {
      var path = w.location.pathname || '/';
      w.location.replace(path + '#home');
    };
    if (copy) copy.onclick = function () {
      var text = plainRows.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          copy.textContent = '已复制';
        }).catch(function () {
          w.prompt('复制诊断文本', text);
        });
      } else {
        w.prompt('复制诊断文本', text);
      }
    };
  }
  function isInAppEmbeddedBrowser() {
    try {
      var ua = String(navigator.userAgent || '');
      if (/MicroMessenger/i.test(ua)) return true;
      if (/MQQBrowser/i.test(ua)) return true;
      if (/\bQQ\//i.test(ua)) return true;
      if (/Weibo/i.test(ua)) return true;
      if (/DingTalk/i.test(ua)) return true;
      if (/AlipayClient/i.test(ua)) return true;
      if (/baiduboxapp/i.test(ua)) return true;
      if (/BytedanceWebview|NewsArticle/i.test(ua)) return true;
      return false;
    } catch (_) {
      return false;
    }
  }
  var rows = [
    remember('时间', new Date().toISOString()),
    remember('地址', w.location.href),
    remember('UA', navigator.userAgent),
    remember('在线', navigator.onLine ? 'yes' : 'no'),
    remember('视口', String(w.innerWidth || 0) + ' x ' + String(w.innerHeight || 0) + ' / dpr ' + String(w.devicePixelRatio || 1)),
    remember('内置浏览器', isInAppEmbeddedBrowser() ? 'yes（建议用系统 Chrome/Safari 打开）' : 'no'),
    remember('模块脚本', ('noModule' in document.createElement('script')) ? 'supported' : 'unknown/old'),
    remember('IndexedDB', ('indexedDB' in w) ? 'exists' : 'missing'),
    remember('ServiceWorker', ('serviceWorker' in navigator) ? (navigator.serviceWorker.controller ? 'controlled' : 'supported, no controller') : 'missing')
  ];
  render(rows, '正在测试资源与本地数据库...');
  function testFetch(label, url) {
    if (!w.fetch) return Promise.resolve(remember(label, 'fetch missing'));
    var timer;
    return Promise.race([
      fetch(url, { cache: 'reload' }).then(function (res) {
        return res.text().then(function (text) {
          var ct = res.headers.get('content-type') || '';
          var head = String(text || '').slice(0, 40).replace(/\s+/g, ' ');
          return remember(label, 'HTTP ' + res.status + ' / ' + ct + ' / ' + head);
        });
      }).catch(function (err) {
        return remember(label, 'ERROR ' + (err && err.message ? err.message : err));
      }),
      new Promise(function (resolve) {
        timer = setTimeout(function () { resolve(remember(label, 'TIMEOUT 8000ms')); }, 8000);
      })
    ]).then(function (html) {
      if (timer) clearTimeout(timer);
      return html;
    });
  }
  function testIdb() {
    if (!('indexedDB' in w)) return Promise.resolve(remember('IDB 打开', 'missing'));
    return new Promise(function (resolve) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        resolve(remember('IDB 打开', 'TIMEOUT 6000ms'));
      }, 6000);
      try {
        var req = indexedDB.open('MarshmallowDiagDB', 1);
        req.onupgradeneeded = function () {
          try { req.result.createObjectStore('t', { keyPath: 'id' }); } catch (_) {}
        };
        req.onsuccess = function () {
          if (done) return;
          done = true;
          clearTimeout(timer);
          try { req.result.close(); indexedDB.deleteDatabase('MarshmallowDiagDB'); } catch (_) {}
          resolve(remember('IDB 打开', 'ok'));
        };
        req.onerror = function () {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(remember('IDB 打开', req.error && req.error.message ? req.error.message : 'error'));
        };
      } catch (err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(remember('IDB 打开', err && err.message ? err.message : err));
      }
    });
  }
  function testPhoneDb() {
    if (!('indexedDB' in w)) return Promise.resolve(remember('MarshmallowPhoneDB', 'missing'));
    return new Promise(function (resolve) {
      var done = false;
      var timer = setTimeout(function () {
        if (done) return;
        done = true;
        resolve(remember('MarshmallowPhoneDB', 'TIMEOUT 10000ms（主程序常用库，超时会导致一直加载）'));
      }, 10000);
      try {
        var req = indexedDB.open('MarshmallowPhoneDB');
        var missing = false;
        req.onupgradeneeded = function (event) {
          if (Number(event && event.oldVersion || 0) !== 0) return;
          missing = true;
          try { event.target.transaction.abort(); } catch (_) {}
        };
        req.onsuccess = function () {
          if (done) return;
          done = true;
          clearTimeout(timer);
          var ver = req.result.version;
          try { req.result.close(); } catch (_) {}
          resolve(remember('MarshmallowPhoneDB', 'ok v' + ver));
        };
        req.onerror = function () {
          if (done) return;
          done = true;
          clearTimeout(timer);
          resolve(remember(
            'MarshmallowPhoneDB',
            missing ? 'missing（诊断已阻止创建新空库）' : (req.error && req.error.message ? req.error.message : 'error')
          ));
        };
        req.onblocked = function () {};
      } catch (err) {
        if (done) return;
        done = true;
        clearTimeout(timer);
        resolve(remember('MarshmallowPhoneDB', err && err.message ? err.message : err));
      }
    });
  }
  Promise.all([
    testFetch('boot.js', 'js/boot.js?v=' + encodeURIComponent(BUILD)),
    testFetch('app.js', 'js/app.js?v=' + encodeURIComponent(BUILD)),
    testFetch('home.js', 'js/pages/home.js?v=' + encodeURIComponent(BUILD)),
    testFetch('db.js', 'js/core/db.js?v=' + encodeURIComponent(BUILD)),
    testFetch('home.css', 'css/home.css?v=' + encodeURIComponent(BUILD)),
    testIdb(),
    testPhoneDb()
  ]).then(function (extra) {
    var note = '诊断页不加载主程序。若 boot/app 返回 HTML 或超时、MarshmallowPhoneDB 超时，即问题源头';
    if (isInAppEmbeddedBrowser()) {
      note += ' 当前是 QQ/微信等内置浏览器，请用系统浏览器打开本站。';
    }
    render(rows.concat(extra), note);
  });
})();
  </script>
  <script>
(function () {
  var w = typeof window !== 'undefined' ? window : {};
  var search = String(w.location && w.location.search || '');
  if (!/[?&]reset=1(?:&|$)/.test(search)) return;
  w.__MARSHMALLOW_RESETTING__ = true;
  // 旧入口曾在这里直接注销 Worker 并删除全部缓存；iOS 上这会删掉唯一可用快照。
  // 现在统一交给急救页：完整校验新版成功后才切换，失败继续保留当前版本。
  w.location.replace('recovery.html?reason=legacy-reset');
})();
  </script>
  <script>
(function () {
  var w = typeof window !== 'undefined' ? window : {};
  w.__MARSHMALLOW_BOOT_OK = false;
  w.__MARSHMALLOW_BOOT_FAILED = false;

  function showBootFallback(title, detail) {
    if (w.__MARSHMALLOW_BOOT_OK) return;
    w.__MARSHMALLOW_BOOT_FAILED = true;
    var app = document.getElementById('app');
    if (!app) return;
    if (w.__mm_selfheal_running__) {
      app.innerHTML =
        '<div style="min-height:100vh;padding:24px 18px;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;background:#fbf6f0;color:#5c7b8f;">' +
        '<p style="font-size:17px;font-weight:600;margin:0 0 12px;">正在自动修复</p>' +
        '<p style="font-size:14px;line-height:1.55;margin:0;">检测到旧版本缓存，正在清理并重新加载，请稍候（本地数据不受影响）。</p>' +
        '</div>';
      return;
    }
    var esc = function (s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    };
    app.innerHTML =
      '<div style="min-height:100vh;padding:24px 18px;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;background:#fbf6f0;color:#5c7b8f;">' +
      '<p style="font-size:17px;font-weight:600;margin:0 0 12px;">' + esc(title) + '</p>' +
      '<p style="font-size:14px;line-height:1.55;margin:0 0 10px;word-break:break-word;">' + esc(detail) + '</p>' +
      '<p style="font-size:12px;line-height:1.5;margin:0;opacity:.85;">可尝试：切换 Wi‑Fi / 蜂窝网络、关闭 VPN；打开急救诊断页安全校验更新（不会删聊天或先删旧版本）。不要用系统里的「清除网站数据」。若从主屏幕图标打开异常，可先用 Safari 标签页打开同一地址。QQ / 微信内置浏览器请改用系统 Chrome 或 Safari。</p>' +
      '<p style="font-size:13px;line-height:1.5;margin:14px 0 0;"><a href="recovery.html" style="color:#c0563f;font-weight:700;">→ 打开急救诊断页（校验更新 / 定位原因）</a></p>' +
      '</div>';
  }

  w.addEventListener(
    'unhandledrejection',
    function (ev) {
      if (w.__MARSHMALLOW_BOOT_OK || w.__MARSHMALLOW_BOOT_FAILED) return;
      var r = ev.reason;
      var msg = r && r.message ? String(r.message) : String(r || 'Promise 被拒绝');
      showBootFallback('启动过程异常', msg);
    },
    false
  );

  w.addEventListener(
    'error',
    function (ev) {
      if (w.__MARSHMALLOW_BOOT_OK || w.__MARSHMALLOW_BOOT_FAILED) return;
      var t = ev.target;
      if (t && t !== w.document && t !== w) {
        var resourceUrl = t.src || t.href || '';
        if (/^https:\/\/static\.cloudflareinsights\.com\/beacon\.min\.js/i.test(String(resourceUrl || ''))) return;
        if (t.tagName !== 'SCRIPT' && (t.tagName !== 'LINK' || (t.rel || '').indexOf('stylesheet') === -1)) {
          return;
        }
      }
      var msg = (ev.error && ev.error.message) || ev.message || '资源或脚本错误';
      if (ev.filename) msg += ' @ ' + ev.filename;
      showBootFallback('页面加载出错', msg);
    },
    true
  );

  setTimeout(function () {
    if (w.__MARSHMALLOW_BOOT_OK || w.__MARSHMALLOW_BOOT_FAILED) return;
    var app = document.getElementById('app');
    var text = app && app.textContent ? String(app.textContent).replace(/\s+/g, '') : '';
    if (!text) {
      showBootFallback(
        '页面没有完成显示',
        '主程序没有报告成功，也没有显示错误。请在当前地址后追加 ?diag=1 发送诊断截图，或追加 ?reset=1 清理旧缓存。'
      );
    }
  }, 12000);

  function checkBootTimeout() {
    if (w.__MARSHMALLOW_BOOT_OK || w.__MARSHMALLOW_BOOT_FAILED) return;
    var longTask = w.__MARSHMALLOW_LONG_BOOT_TASK__;
    if (longTask && Date.now() - Number(longTask.updatedAt || 0) < 120000) {
      var activeLoading = document.getElementById('boot-loading');
      if (activeLoading) {
        var restored = Math.max(0, Number(longTask.restored || 0));
        var total = Math.max(0, Number(longTask.total || 0));
        var progressText = total > 0 ? '（' + restored + ' / ' + total + '）' : '';
        var reasonText = longTask.reason ? '\n' + String(longTask.reason) : '';
        activeLoading.style.whiteSpace = 'pre-line';
        activeLoading.textContent = String(longTask.label || '正在恢复本地数据') + progressText + '…' + reasonText;
      }
      setTimeout(checkBootTimeout, 30000);
      return;
    }
    var loading = document.getElementById('boot-loading');
    if (!loading) {
      var app = document.getElementById('app');
      var text = app && app.textContent ? String(app.textContent).replace(/\s+/g, '') : '';
      if (!text) {
        showBootFallback(
          '页面没有完成显示',
          '主程序没有报告成功，也没有显示错误。请先点开当前地址后追加 ?diag=1 发送诊断截图，或追加 ?reset=1 清理旧缓存。'
        );
      }
      return;
    }
    showBootFallback(
      '加载超时',
      '页面长时间未完成初始化。若网络正常，可能是本地数据库首次创建较慢或被系统限制；请切换网络，或打开 /recovery 安全校验更新（不会删聊天或先删旧版本）。'
    );
  }
  setTimeout(checkBootTimeout, 35000);
})();
  </script>
